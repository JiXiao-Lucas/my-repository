<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1800" viewBox="0 0 900 1800"><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202c31}.m{fill:#60737a}.g{fill:#08ad68}.h{font-weight:700}.s{font-size:20px}.n{font-size:25px}.b{font-size:35px}</style></defs><rect width="900" height="1800" fill="#effff8"/><rect x="28" y="24" width="844" height="1752" rx="28" fill="#fff"/><text x="58" y="82" class="h b">华润城门店 · 二手房源专项诊断</text><text x="58" y="124" class="m n">统计周期：本月截至 ×× 日</text><line x1="58" y1="155" x2="842" y2="155" stroke="#cfe3da"/>
<text x="58" y="215" class="h b">一、业绩与业务表现诊断</text><text x="58" y="265" class="h n">1. 房源量与成交表现</text><text x="88" y="310" class="n">• 二手房源量 1×× 套，环比变化 ××%，排名区域 ×/×。</text><text x="88" y="350" class="n">• 新增房源 2× 套，维护有效率 ××%，需关注重点片区。</text><text x="88" y="390" class="n">• 业绩贡献 ××.× 万，核心指标已按隐私规则处理。</text><rect x="88" y="430" width="724" height="150" rx="18" fill="#f5faf7"/><text x="118" y="475" class="h n">AI 经营诊断</text><text x="118" y="520" class="m n">当前房源规模具备基础，但新增与维护效率存在波动。</text><text x="118" y="558" class="m n">建议聚焦重点楼盘、责任到人并持续追踪动作结果。</text>
<text x="58" y="645" class="h n">2. 房源结构与质量</text><text x="88" y="690" class="n">• 核心盘源占比 ××%，有效房源 ×× 套。</text><text x="88" y="730" class="n">• 高潜房源集中在 × 个板块，建议优先补齐素材与标签。</text><text x="88" y="770" class="n">• 异常数据和具体人员姓名均已匿名化。</text>
<text x="58" y="845" class="h n">3. 团队执行效率</text><text x="88" y="890" class="n">• 维护及时率 ××%，跟进完成率 ××%。</text><text x="88" y="930" class="n">• 重点人员：程××、张××、赵×，均仅保留姓氏。</text><text x="88" y="970" class="n">• 建议通过任务提醒与每日复盘提升执行稳定性。</text>
<line x1="58" y1="1030" x2="842" y2="1030" stroke="#bcd7cb" stroke-width="2"/><text x="58" y="1090" class="h b">二、核心指标对比</text><rect x="58" y="1140" width="784" height="250" rx="16" fill="#fff" stroke="#bfe2d2" stroke-width="2"/><rect x="58" y="1140" width="784" height="64" rx="16" class="g"/><text x="135" y="1182" font-size="24" fill="#fff" font-weight="700">指标</text><text x="360" y="1182" font-size="24" fill="#fff" font-weight="700">当前值</text><text x="565" y="1182" font-size="24" fill="#fff" font-weight="700">环比</text><text x="745" y="1182" font-size="24" fill="#fff" font-weight="700">排名</text><text x="98" y="1265" class="n">有效房源率</text><text x="352" y="1265" class="n">1×.×%</text><text x="560" y="1265" class="n">-3×.×%</text><text x="735" y="1265" class="n">1×/××</text><text x="98" y="1340" class="n">维护及时率</text><text x="352" y="1340" class="n">1×.×%</text><text x="560" y="1340" class="n">-4×.×%</text><text x="735" y="1340" class="n">××/××</text>
<text x="58" y="1460" class="h b">三、行动建议</text><text x="88" y="1510" class="n">1. 建立重点房源清单，明确责任人与完成时限。</text><text x="88" y="1550" class="n">2. 对环比下降指标进行门店—人员—房源三级下钻。</text><text x="88" y="1590" class="n">3. 每周复盘建议采纳情况，验证经营动作是否有效。</text><rect x="58" y="1650" width="784" height="82" rx="18" fill="#eafff4"/><text x="88" y="1702" class="g h n">小诸葛 AI：本报告中的姓名与数字均已匿名化展示。</text></svg>
